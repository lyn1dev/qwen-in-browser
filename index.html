<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3 0.6B — browser inference</title>
<meta name="description" content="Qwen3 0.6B running entirely in your browser. Uses WebGPU when the GPU supports it and falls back automatically.">
<style>
  :root {
    --canvas: oklch(0.150000 0.030000 254.000);
    --surface: oklch(0.170000 0.032000 252.500);
    --surface-raised: oklch(0.198000 0.034000 251.500);
    --surface-overlay: oklch(0.225000 0.036000 252.500);
    --text: oklch(0.985000 0.006000 250.000);
    --text-muted: oklch(0.660054 0.010341 273.310);
    --secondary-label: oklch(0.660054 0.010341 273.310);
    --muted: oklch(0.249044 0.042281 246.065);
    --muted-fg: oklch(0.700239 0.014665 261.588);
    --border: oklch(0.245000 0.042000 249.000);
    --accent: oklch(0.760000 0.128000 241.500);
    --accent-fg: oklch(0.224667 0.031311 328.979);
    --secondary: oklch(0.279806 0.049617 244.911);
    --placeholder: oklch(0.730301 0.009173 281.271);
    --code-bg: oklch(0.185000 0.030000 252.000);
    --error: oklch(0.655108 0.221148 23.473);
    --warning: oklch(0.772406 0.172798 65.367);
    --scrollbar: oklch(0.586130 0.012959 267.220);
    --scrollbar-hover: oklch(0.681569 0.010909 276.465);
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    height: 100dvh;
    overflow: hidden;
    background: var(--canvas);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  /* ---------- scrollbars ---------- */

  * {
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
  }

  ::-webkit-scrollbar { width: 12px; height: 12px; }

  ::-webkit-scrollbar-track { background: transparent; }

  ::-webkit-scrollbar-thumb {
    background-color: color-mix(in oklch, var(--scrollbar) 45%, transparent);
    border-radius: 99px;
    border: 4px solid transparent;
    background-clip: content-box;
  }

  ::-webkit-scrollbar-thumb:hover {
    background-color: color-mix(in oklch, var(--scrollbar-hover) 75%, transparent);
    background-clip: content-box;
  }

  ::-webkit-scrollbar-corner { background: transparent; }

  .shell {
    width: 100%;
    max-width: 760px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  /* ---------- header ---------- */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 0 16px;
    flex-wrap: wrap;
    flex: none;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }

  .brand h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand span {
    font-size: 11.5px;
    color: var(--secondary-label);
    font-family: var(--mono);
    letter-spacing: 0.02em;
  }

  .gpu {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted-fg);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    max-width: 100%;
    min-width: 0;
  }

  .gpu > span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--secondary-label);
    flex: none;
  }
  .dot.ok { background: var(--accent); }
  .dot.warn { background: var(--warning); }
  .dot.bad { background: var(--error); }

  /* ---------- loader ---------- */

  .loader {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
    flex: none;
  }

  .loader.hidden { display: none; }

  .loader-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .loader-title { font-weight: 550; font-size: 13.5px; }

  .loader-sub {
    color: var(--secondary-label);
    font-size: 12px;
    margin-top: 3px;
    font-family: var(--mono);
    overflow-wrap: anywhere;
  }

  .loader-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }

  .track {
    height: 3px;
    border-radius: 99px;
    background: var(--muted);
    overflow: hidden;
    margin-top: 13px;
  }

  .track > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: var(--accent);
    transition: width .25s ease;
  }

  .track.indeterminate > i {
    width: 40% !important;
    animation: slide 1.1s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ---------- controls ---------- */

  button {
    font: inherit;
    font-size: 13px;
    font-weight: 550;
    cursor: pointer;
    border-radius: 9px;
    border: 1px solid transparent;
    padding: 8px 15px;
    transition: background .15s, border-color .15s, opacity .15s, transform .08s;
    white-space: nowrap;
  }

  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-primary:hover:not(:disabled) { background: oklch(0.815308 0.096174 199.862); }

  .btn-ghost {
    background: var(--secondary);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-overlay); border-color: var(--muted-fg); }

  select {
    font: inherit;
    font-size: 12.5px;
    color: var(--text);
    background: var(--secondary);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 7px;
    cursor: pointer;
    outline: none;
  }

  select:focus { border-color: var(--accent); }

  /* ---------- chat ---------- */

  .chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 4px 4px 20px 0;
  }

  .msg { display: flex; animation: rise .2s ease-out; min-width: 0; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  .msg.user {
    align-self: flex-end;
    max-width: 88%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 9px 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .msg.bot {
    align-self: stretch;
    min-width: 0;
    max-width: 100%;
    color: var(--text);
  }

  .cursor {
    display: inline-block;
    width: 2px; height: 16px;
    background: var(--accent);
    vertical-align: -3px;
    margin-left: 2px;
    animation: blink 1s steps(2, start) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- markdown ---------- */

  .md { overflow-wrap: anywhere; min-width: 0; max-width: 100%; }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }

  .md p { margin: 0 0 11px; }

  .md h3, .md h4, .md h5, .md h6 {
    margin: 18px 0 8px;
    line-height: 1.35;
    font-weight: 600;
  }
  .md h3 { font-size: 16px; }
  .md h4 { font-size: 15px; }
  .md h5, .md h6 { font-size: 14px; }

  .md ul, .md ol { margin: 0 0 11px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md li::marker { color: var(--muted-fg); }

  .md blockquote {
    margin: 11px 0;
    padding: 2px 0 2px 13px;
    border-left: 2px solid var(--accent);
    color: var(--muted-fg);
  }

  .md hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  .md a { color: var(--accent); text-decoration: none; }
  .md a:hover { text-decoration: underline; }

  .md strong { color: var(--text); font-weight: 650; }

  .md code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
  }

  .code-block {
    margin: 12px 0;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    max-width: 100%;
  }

  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 8px 5px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--secondary-label);
  }

  .code-head .copy {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted-fg);
    border-radius: 6px;
  }

  .code-head .copy:hover {
    color: var(--text);
    border-color: var(--muted-fg);
    background: var(--surface-overlay);
  }

  .code-block pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
    max-width: 100%;
  }

  .code-block pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 12.5px;
    line-height: 1.55;
    white-space: pre;
  }

  /* ---------- empty state ---------- */

  .empty {
    margin: auto 0;
    text-align: center;
    padding: 20px 0 28px;
  }

  .empty.hidden { display: none; }

  .empty h2 {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 550;
    color: var(--muted-fg);
  }

  .empty p {
    margin: 0 0 20px;
    font-size: 13px;
    color: var(--secondary-label);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .chip {
    font-size: 12.5px;
    font-weight: 450;
    color: var(--muted-fg);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
  }

  .chip:hover { border-color: var(--muted-fg); color: var(--text); background: var(--surface-raised); }

  /* ---------- composer ---------- */

  .composer {
    flex: none;
    padding: 10px 0 16px;
  }

  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 9px 9px 14px;
    transition: border-color .15s;
  }

  .input-wrap:focus-within { border-color: var(--accent); }

  textarea {
    flex: 1;
    font: inherit;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--text);
    background: none;
    border: none;
    outline: none;
    resize: none;
    padding: 4px 0;
    max-height: 150px;
    min-height: 27px;
  }

  textarea::placeholder { color: var(--placeholder); }

  .actions { display: flex; gap: 8px; align-items: center; }

  .stats {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--secondary-label);
    padding: 8px 3px 0;
    min-height: 20px;
    flex-wrap: wrap;
  }

  .stats .right { color: var(--muted-fg); }

  @media (max-width: 560px) {
    .shell { padding: 0 13px; }
    header { padding: 15px 0 12px; }
    .brand h1 { font-size: 15px; }
    .brand span { display: none; }
    .loader-actions { width: 100%; }
    .loader-actions button { flex: 1; }
    .msg.user { max-width: 92%; }
  }
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="brand">
      <h1>Qwen3 0.6B</h1>
      <span>local inference</span>
    </div>
    <div class="gpu" id="gpuBadge">
      <span class="dot" id="gpuDot"></span>
      <span id="gpuLabel">probing hardware…</span>
    </div>
  </header>

  <div class="loader" id="loader">
    <div class="loader-top">
      <div>
        <div class="loader-title" id="loaderTitle">Qwen3 0.6B · quantized</div>
        <div class="loader-sub" id="loaderSub">picks the fastest backend your hardware supports</div>
      </div>
      <div class="loader-actions">
        <select id="devicePref" title="Backend">
          <option value="auto">Auto</option>
          <option value="webgpu">GPU only</option>
          <option value="wasm">CPU only</option>
        </select>
        <button class="btn-primary" id="loadBtn">Load model</button>
      </div>
    </div>
    <div class="track" id="track"><i id="bar"></i></div>
  </div>

  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <h2>Runs on your machine, not a server</h2>
      <p>No API key, no requests leaving the device.</p>
      <div class="chips">
        <button class="chip" data-p="Explain WebGPU to a backend developer in three sentences.">Explain WebGPU</button>
        <button class="chip" data-p="Write a Python function that retries a request with exponential backoff. Show the code.">Retry with backoff</button>
        <button class="chip" data-p="What are the tradeoffs of running an LLM in the browser?">Browser LLM tradeoffs</button>
        <button class="chip" data-p="Give me three one-line shell commands for finding large files.">Shell one-liners</button>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Load the model to start…" disabled></textarea>
      <div class="actions">
        <button class="btn-ghost" id="stopBtn" hidden>Stop</button>
        <button class="btn-primary" id="sendBtn" disabled>Send</button>
      </div>
    </div>
    <div class="stats">
      <span id="statLeft">idle</span>
      <span class="right" id="statRight"></span>
    </div>
  </div>
</div>

<script type="module">
import { pipeline, TextStreamer, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2";

env.allowLocalModels = false;

const MODEL_ID = "onnx-community/Qwen3-0.6B-ONNX";

// Qwen3 starts every reply with a reasoning preamble. transformers.js drops
// enable_thinking (both tokenizer_kwargs and chat_template_kwargs are ignored),
// so prompts are built by hand with an empty think block. Same result, much faster.
const THINK_OFF = "<|im_start|>assistant\n<think>\n\n</think>\n\n";

const el = (id) => document.getElementById(id);
const chat = el("chat"), empty = el("empty"), input = el("input");
const sendBtn = el("sendBtn"), stopBtn = el("stopBtn"), loadBtn = el("loadBtn");

let generator = null;
let backend = null;
let busy = false;
let cancelled = false;
const history = [];

// ------------------------------------------------------------ capability probe

const caps = {
  webgpu: false,
  fp16: false,
  maxBuffer: 0,
  vendor: "",
  arch: "",
  desc: "",
};

async function probe() {
  if (!navigator.gpu) return caps;

  try {
    // high-performance asks for the discrete GPU on hybrid laptops. Where the
    // platform ignores it (Windows currently does) this is simply a no-op.
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
    if (!adapter) return caps;

    caps.webgpu = true;
    // fp16 shader support is what separates the 4-bit fp16 build from the fp32
    // one. Plenty of integrated and mobile GPUs lack it.
    caps.fp16 = adapter.features.has("shader-f16");
    caps.maxBuffer = adapter.limits.maxBufferSize || 0;

    const info = adapter.info || {};
    caps.vendor = info.vendor || "";
    caps.arch = info.architecture || "";
    caps.desc = info.description || "";
  } catch {
    caps.webgpu = false;
  }

  return caps;
}

function renderBadge() {
  const dot = el("gpuDot"), label = el("gpuLabel");

  if (!caps.webgpu) {
    dot.classList.add(navigator.gpu ? "bad" : "warn");
    label.textContent = navigator.gpu ? "no GPU adapter — CPU only" : "no WebGPU — CPU only";
    return;
  }

  const name = [caps.vendor, caps.arch || caps.desc].filter(Boolean).join(" · ") || "adapter";
  dot.classList.add("ok");
  label.textContent = caps.fp16 ? `WebGPU · ${name}` : `WebGPU · ${name} (no fp16)`;
}

// ------------------------------------------------------------------ load plan

// Ordered fallbacks. Each rung is tried only if the one above it fails, so the
// normal path costs nothing extra.
function buildPlan(pref) {
  const gpu = [];
  if (caps.fp16) gpu.push({ device: "webgpu", dtype: "q4f16", label: "GPU · fp16", size: 570 });
  gpu.push({ device: "webgpu", dtype: "q4", label: "GPU · fp32", size: 919 });

  // int8 first here: on this repo it is both smaller than the 4-bit build
  // (619 MB vs 919 MB) and faster on wasm, which skips dequantisation work.
  const cpu = [
    { device: "wasm", dtype: "q8", label: "CPU · int8", size: 619 },
    { device: "wasm", dtype: "q4", label: "CPU · int4", size: 919 },
  ];

  if (pref === "wasm") return cpu;
  if (pref === "webgpu") return gpu;
  return caps.webgpu ? [...gpu, ...cpu] : cpu;
}

function configureCpu() {
  try {
    const wasm = env.backends?.onnx?.wasm;
    if (!wasm) return;
    wasm.proxy = false;
    // Multi-threaded wasm needs cross-origin isolation for SharedArrayBuffer.
    // GitHub Pages doesn't send COOP/COEP, so this normally lands on 1 thread.
    wasm.numThreads = self.crossOriginIsolated
      ? Math.min(4, navigator.hardwareConcurrency || 1)
      : 1;
  } catch {
    /* older runtimes expose a different shape */
  }
}

function setProgress(pct, text, indeterminate = false) {
  const bar = el("bar"), track = el("track");
  if (indeterminate) {
    track.classList.add("indeterminate");
  } else {
    track.classList.remove("indeterminate");
    bar.style.width = (pct ?? 0) + "%";
  }
  if (text) el("loaderSub").textContent = text;
}

async function createPipeline(step) {
  if (step.device === "wasm") configureCpu();

  const pipe = await pipeline("text-generation", MODEL_ID, {
    device: step.device,
    dtype: step.dtype,
    progress_callback: (p) => {
      if (p.status === "progress" && p.total) {
        const pct = Math.round((p.loaded / p.total) * 100);
        const file = (p.file || "").split("/").pop();
        setProgress(pct, `${step.label} · ${file || "weights"} · ${pct}%`);
      } else if (p.status === "initiate") {
        const file = (p.file || "").split("/").pop();
        setProgress(null, `${step.label} · fetching ${file || "weights"}`);
      } else if (p.status === "done") {
        setProgress(100, `${step.label} · compiling`);
      }
    },
  });

  // Some drivers create the session happily and only die on the first kernel
  // launch. A one-token warmup surfaces that here instead of mid-conversation.
  setProgress(null, `${step.label} · warming up`);
  await pipe("hi", { max_new_tokens: 1, do_sample: false, return_full_text: false });

  return pipe;
}

loadBtn.addEventListener("click", async () => {
  const pref = el("devicePref").value;
  const plan = buildPlan(pref);

  loadBtn.disabled = true;
  loadBtn.textContent = "Loading…";
  el("devicePref").disabled = true;
  el("statLeft").textContent = "loading";
  setProgress(0, "starting…");

  const failures = [];

  for (const step of plan) {
    try {
      el("statLeft").textContent = `loading · ${step.label}`;
      setProgress(0, `${step.label} · ~${step.size} MB`);
      generator = await createPipeline(step);
      backend = step;
      break;
    } catch (err) {
      failures.push(`${step.label}: ${(err && err.message) || err}`);
      console.warn(`[backend] ${step.label} failed`, err);
      generator = null;
    }
  }

  if (!generator) {
    el("loaderSub").style.color = "var(--error)";
    el("loaderSub").textContent = "no usable backend — " + (failures.at(-1) || "unknown error");
    el("loaderTitle").textContent = "Load failed";
    el("bar").style.width = "0%";
    loadBtn.disabled = false;
    loadBtn.textContent = "Retry";
    el("devicePref").disabled = false;
    el("statLeft").textContent = "failed";
    console.error(failures.join("\n"));
    return;
  }

  el("loader").classList.add("hidden");
  el("devicePref").disabled = false;
  input.disabled = false;
  input.placeholder = "Ask anything…";
  sendBtn.disabled = false;
  el("statLeft").textContent = `ready · ${backend.label}`;
  if (failures.length) el("statLeft").title = "fallbacks: " + failures.join("\n");
  input.focus();
});

// ------------------------------------------------------------------- prompting

function buildPrompt(question) {
  let out = "";
  for (const turn of history) {
    if (turn.role === "user") {
      out += `<|im_start|>user\n${turn.content}<|im_end|>\n`;
    } else {
      out += `<|im_start|>assistant\n<think>\n\n</think>\n\n${turn.content}<|im_end|>\n`;
    }
  }
  out += `<|im_start|>user\n${question}<|im_end|>\n`;
  out += THINK_OFF;
  return out;
}

// ------------------------------------------------------------------ markdown

const esc = (s) =>
  String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

// Inline spans. Input is escaped first, so no raw HTML can slip through; code
// spans are stashed so their contents never get treated as emphasis.
function inline(s) {
  let t = esc(s);
  const spans = [];

  t = t.replace(/`([^`\n]+)`/g, (_, code) => {
    spans.push(code);
    return `\u0001${spans.length - 1}\u0001`;
  });

  t = t.replace(/\*\*(?!\s)([\s\S]+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[\s(>])\*(?!\s)([^*\n]+?)\*/g, "$1<em>$2</em>");
  t = t.replace(/(^|[\s(>])_(?!\s)([^_\n]+?)_/g, "$1<em>$2</em>");
  t = t.replace(
    /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
  );

  return t.replace(/\u0001(\d+)\u0001/g, (_, i) => `<code>${spans[+i]}</code>`);
}

function codeBlockHtml(lang, code) {
  const label = esc((lang || "").trim()) || "text";
  return (
    '<div class="code-block"><div class="code-head"><span>' +
    label +
    '</span><button class="copy" type="button">Copy</button></div>' +
    "<pre><code>" +
    esc(code.replace(/\n$/, "")) +
    "</code></pre></div>"
  );
}

// Small block parser: fenced code, headings, lists, quotes, rules, paragraphs.
function renderMarkdown(src) {
  const blocks = [];

  const stash = (lang, code) => {
    blocks.push({ lang, code });
    return `\n\u0000${blocks.length - 1}\u0000\n`;
  };

  let text = src.replace(/```([\w+#.-]*)[ \t]*\r?\n([\s\S]*?)```/g, (_, lang, code) =>
    stash(lang, code)
  );

  // A fence still being streamed: show it as a block rather than raw ticks.
  const open = text.indexOf("```");
  if (open !== -1) {
    const rest = text.slice(open + 3);
    const nl = rest.indexOf("\n");
    const lang = (nl === -1 ? rest : rest.slice(0, nl)).trim();
    const code = nl === -1 ? "" : rest.slice(nl + 1);
    text = text.slice(0, open) + stash(lang, code);
  }

  const out = [];
  let para = [];
  let list = null;

  const flushPara = () => {
    if (!para.length) return;
    out.push("<p>" + para.map(inline).join("<br>") + "</p>");
    para = [];
  };

  const flushList = () => {
    if (!list) return;
    const tag = list.type;
    out.push("<" + tag + ">" + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + "</" + tag + ">");
    list = null;
  };

  const flushAll = () => {
    flushPara();
    flushList();
  };

  for (const rawLine of text.split("\n")) {
    const line = rawLine.replace(/\s+$/, "");
    const marker = line.match(/^\u0000(\d+)\u0000$/);

    if (marker) {
      flushAll();
      const b = blocks[+marker[1]];
      out.push(codeBlockHtml(b.lang, b.code));
      continue;
    }

    if (!line.trim()) {
      flushAll();
      continue;
    }

    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
      flushAll();
      out.push("<hr>");
      continue;
    }

    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      flushAll();
      const level = Math.min(heading[1].length + 2, 6);
      out.push(`<h${level}>${inline(heading[2])}</h${level}>`);
      continue;
    }

    const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
    if (bullet) {
      flushPara();
      if (!list || list.type !== "ul") {
        flushList();
        list = { type: "ul", items: [] };
      }
      list.items.push(bullet[1]);
      continue;
    }

    const ordered = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ordered) {
      flushPara();
      if (!list || list.type !== "ol") {
        flushList();
        list = { type: "ol", items: [] };
      }
      list.items.push(ordered[1]);
      continue;
    }

    const quote = line.match(/^>\s?(.*)$/);
    if (quote) {
      flushAll();
      out.push("<blockquote>" + inline(quote[1]) + "</blockquote>");
      continue;
    }

    flushList();
    para.push(line);
  }

  flushAll();
  return out.join("");
}

// ---------------------------------------------------------------------- render

function addTurn(role, text) {
  empty.classList.add("hidden");

  const wrap = document.createElement("div");
  wrap.className = "msg " + role;

  if (role === "user") {
    wrap.textContent = text;
    chat.append(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  const md = document.createElement("div");
  md.className = "md";
  wrap.append(md);
  chat.append(wrap);
  chat.scrollTop = chat.scrollHeight;
  return md;
}

chat.addEventListener("click", (e) => {
  const btn = e.target.closest(".copy");
  if (!btn) return;

  const code = btn.closest(".code-block")?.querySelector("code");
  if (!code || !navigator.clipboard) return;

  navigator.clipboard.writeText(code.textContent).then(() => {
    btn.textContent = "Copied";
    setTimeout(() => (btn.textContent = "Copy"), 1200);
  }).catch(() => {});
});

// ------------------------------------------------------------------ generation

async function ask(question) {
  if (!generator || busy) return;

  busy = true;
  cancelled = false;
  sendBtn.disabled = true;
  stopBtn.hidden = false;
  input.value = "";
  autosize();

  addTurn("user", question);

  const md = addTurn("bot", "");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  md.append(cursor);

  let raw = "";
  let chunks = 0;
  let frame = null;
  const started = performance.now();

  // Re-rendering on every token would thrash layout; coalesce to one paint.
  const paint = () => {
    frame = null;
    md.innerHTML = renderMarkdown(raw);
    md.append(cursor);
    chat.scrollTop = chat.scrollHeight;
  };

  const streamer = new TextStreamer(generator.tokenizer, {
    skip_prompt: true,
    skip_special_tokens: true,
    callback_function: (text) => {
      if (cancelled) throw new Error("__cancel__");
      raw += text;
      chunks++;
      if (frame === null) frame = requestAnimationFrame(paint);

      const secs = (performance.now() - started) / 1000;
      if (secs > 0.4) {
        el("statRight").textContent = `${(chunks / secs).toFixed(1)} tok/s`;
      }
    },
  });

  try {
    await generator(buildPrompt(question), {
      max_new_tokens: 512,
      do_sample: true,
      temperature: 0.6,
      top_k: 20,
      top_p: 0.95,
      repetition_penalty: 1.1,
      return_full_text: false,
      streamer,
    });
  } catch (err) {
    if (!String(err.message).includes("__cancel__")) {
      if (frame !== null) cancelAnimationFrame(frame);
      cursor.remove();
      md.innerHTML = "";
      const p = document.createElement("p");
      p.textContent = "Error: " + err.message;
      p.style.color = "var(--error)";
      md.append(p);
      finish();
      return;
    }
  }

  if (frame !== null) cancelAnimationFrame(frame);
  const answer = raw.trim();
  md.innerHTML = renderMarkdown(answer);
  cursor.remove();

  if (answer) {
    history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: answer });
    // Keep the prefill bounded once a conversation grows.
    if (history.length > 8) history.splice(0, history.length - 8);
  } else {
    md.innerHTML = '<p style="color:var(--secondary-label)">(stopped)</p>';
  }

  const total = (performance.now() - started) / 1000;
  el("statRight").textContent = `${chunks} chunks · ${total.toFixed(1)}s`;
  finish();
}

function finish() {
  busy = false;
  sendBtn.disabled = false;
  stopBtn.hidden = true;
  input.focus();
}

stopBtn.addEventListener("click", () => {
  cancelled = true;
  stopBtn.disabled = true;
  setTimeout(() => (stopBtn.disabled = false), 300);
});

// -------------------------------------------------------------------- compose

function submit() {
  const text = input.value.trim();
  if (!text) return;
  ask(text);
}

sendBtn.addEventListener("click", submit);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
});

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
}

input.addEventListener("input", autosize);

document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    if (!generator) return;
    ask(chip.dataset.p);
  });
});

// ----------------------------------------------------------------------- boot

probe().then(renderBadge);
</script>
</body>
</html>
