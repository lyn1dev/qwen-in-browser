<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3 0.6B — browser inference</title>
<meta name="description" content="Qwen3 0.6B running entirely in your browser on WebGPU. Weights are cached locally after the first load.">
<style>
  :root {
    --bg: #0a0b0d;
    --panel: #101216;
    --panel-2: #16191e;
    --line: #22262d;
    --line-soft: #1a1e24;
    --fg: #e9eef4;
    --fg-dim: #9aa5b4;
    --fg-faint: #626d7c;
    --accent: #5eead4;
    --accent-dim: #2dd4bf;
    --danger: #f87171;
    --warn: #fbbf24;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 520px at 50% -220px, #16202a 0%, transparent 70%),
      var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  .shell {
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  /* ---------- header ---------- */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 26px 0 18px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }

  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand span {
    font-size: 12px;
    color: var(--fg-faint);
    font-family: var(--mono);
    letter-spacing: 0.02em;
  }

  .gpu {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-dim);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 11px;
    max-width: 100%;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--fg-faint);
    flex: none;
  }
  .dot.ok { background: var(--accent); box-shadow: 0 0 8px rgba(94,234,212,.55); }
  .dot.bad { background: var(--danger); }
  .dot.wait { background: var(--warn); }

  /* ---------- loader ---------- */

  .loader {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
    transition: opacity .3s, transform .3s;
  }

  .loader.hidden { display: none; }

  .loader-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .loader-title { font-weight: 550; font-size: 14px; }

  .loader-sub {
    color: var(--fg-faint);
    font-size: 12.5px;
    margin-top: 3px;
    font-family: var(--mono);
  }

  .track {
    height: 4px;
    border-radius: 99px;
    background: var(--line-soft);
    overflow: hidden;
    margin-top: 15px;
  }

  .track > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width .25s ease;
  }

  .track.indeterminate > i {
    width: 40% !important;
    animation: slide 1.1s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ---------- buttons ---------- */

  button {
    font: inherit;
    font-size: 13.5px;
    font-weight: 550;
    cursor: pointer;
    border-radius: 9px;
    border: 1px solid transparent;
    padding: 9px 16px;
    transition: background .15s, border-color .15s, opacity .15s, transform .08s;
    white-space: nowrap;
  }

  button:active:not(:disabled) { transform: translateY(1px); }

  button:disabled { opacity: .4; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    color: #04211c;
  }
  .btn-primary:hover:not(:disabled) { background: #7df0dd; }

  .btn-ghost {
    background: var(--panel-2);
    color: var(--fg);
    border-color: var(--line);
  }
  .btn-ghost:hover:not(:disabled) { border-color: #333a44; background: #1b1f26; }

  /* ---------- chat ---------- */

  .chat {
    flex: 1;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 4px 0 18px;
    overflow-y: auto;
  }

  .msg {
    display: flex;
    gap: 11px;
    animation: rise .22s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: none; }
  }

  .avatar {
    width: 26px; height: 26px;
    border-radius: 7px;
    flex: none;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--mono);
    margin-top: 2px;
  }

  .msg.user .avatar {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--fg-dim);
  }

  .msg.bot .avatar {
    background: rgba(94,234,212,.12);
    border: 1px solid rgba(94,234,212,.28);
    color: var(--accent);
  }

  .bubble {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .msg.user .bubble { color: var(--fg); }

  .msg.bot .bubble { color: #dbe3ec; }

  .cursor {
    display: inline-block;
    width: 7px; height: 15px;
    background: var(--accent);
    vertical-align: -2px;
    margin-left: 1px;
    animation: blink 1s steps(2, start) infinite;
    border-radius: 1px;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- empty state ---------- */

  .empty {
    margin: auto 0;
    text-align: center;
    padding: 26px 0 32px;
  }

  .empty.hidden { display: none; }

  .empty h2 {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 550;
    color: var(--fg-dim);
  }

  .empty p {
    margin: 0 0 20px;
    font-size: 13px;
    color: var(--fg-faint);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .chip {
    font-size: 12.5px;
    font-weight: 450;
    color: var(--fg-dim);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
  }

  .chip:hover { border-color: #333a44; color: var(--fg); background: var(--panel-2); }

  /* ---------- composer ---------- */

  .composer {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    padding: 12px 0 20px;
  }

  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 10px 10px 14px;
    transition: border-color .15s;
  }

  .input-wrap:focus-within { border-color: #2f3742; }

  textarea {
    flex: 1;
    font: inherit;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--fg);
    background: none;
    border: none;
    outline: none;
    resize: none;
    padding: 4px 0;
    max-height: 160px;
    min-height: 28px;
  }

  textarea::placeholder { color: var(--fg-faint); }

  .actions { display: flex; gap: 8px; align-items: center; }

  .stats {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-faint);
    padding: 9px 4px 0;
    min-height: 22px;
    flex-wrap: wrap;
  }

  .stats .right { color: var(--fg-dim); }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  @media (max-width: 560px) {
    .shell { padding: 0 14px; }
    header { padding: 18px 0 14px; }
    .brand h1 { font-size: 15px; }
    .brand span { display: none; }
    .chat { min-height: 220px; }
  }
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="brand">
      <h1>Qwen3 0.6B</h1>
      <span>local inference</span>
    </div>
    <div class="gpu" id="gpuBadge">
      <span class="dot" id="gpuDot"></span>
      <span id="gpuLabel">checking WebGPU…</span>
    </div>
  </header>

  <div class="loader" id="loader">
    <div class="loader-top">
      <div>
        <div class="loader-title" id="loaderTitle">Qwen3 0.6B · 4-bit</div>
        <div class="loader-sub" id="loaderSub">570 MB — fetched once, then cached by the browser</div>
      </div>
      <button class="btn-primary" id="loadBtn">Load model</button>
    </div>
    <div class="track" id="track"><i id="bar"></i></div>
  </div>

  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <h2>Runs on your GPU, not a server</h2>
      <p>No API key, no requests leaving the device.</p>
      <div class="chips">
        <button class="chip" data-p="Explain WebGPU to a backend developer in three sentences.">Explain WebGPU</button>
        <button class="chip" data-p="Write a haiku about compiling Rust.">Write a haiku</button>
        <button class="chip" data-p="What are the tradeoffs of running an LLM in the browser?">Browser LLM tradeoffs</button>
        <button class="chip" data-p="Give me three one-line shell commands for finding large files.">Shell one-liners</button>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Load the model to start…" disabled></textarea>
      <div class="actions">
        <button class="btn-ghost" id="stopBtn" hidden>Stop</button>
        <button class="btn-primary" id="sendBtn" disabled>Send</button>
      </div>
    </div>
    <div class="stats">
      <span id="statLeft">idle</span>
      <span class="right" id="statRight"></span>
    </div>
  </div>
</div>

<script type="module">
import { pipeline, TextStreamer, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2";

env.allowLocalModels = false;

const MODEL_ID = "onnx-community/Qwen3-0.6B-ONNX";

// Qwen3 defaults to a reasoning preamble. It cannot be switched off through
// transformers.js (enable_thinking is dropped by the tokenizer wrapper), so the
// prompt is assembled by hand with an empty think block. Same effect, ~4x faster.
const THINK_OFF = "<|im_start|>assistant\n<think>\n\n</think>\n\n";

const el = (id) => document.getElementById(id);
const chat = el("chat"), empty = el("empty"), input = el("input");
const sendBtn = el("sendBtn"), stopBtn = el("stopBtn"), loadBtn = el("loadBtn");

let generator = null;
let device = "webgpu";
let busy = false;
let cancelled = false;
const history = [];

// ---------------------------------------------------------------- device probe

(async () => {
  const dot = el("gpuDot"), label = el("gpuLabel");

  if (!navigator.gpu) {
    device = "wasm";
    dot.classList.add("bad");
    label.textContent = "WebGPU unavailable — CPU fallback";
    return;
  }

  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
      device = "wasm";
      dot.classList.add("bad");
      label.textContent = "no GPU adapter — CPU fallback";
      return;
    }
    const info = adapter.info || {};
    const bits = [info.vendor, info.architecture].filter(Boolean).join(" ");
    dot.classList.add("ok");
    label.textContent = bits ? `WebGPU · ${bits}` : "WebGPU ready";
  } catch {
    device = "wasm";
    dot.classList.add("bad");
    label.textContent = "WebGPU probe failed — CPU fallback";
  }
})();

// --------------------------------------------------------------------- loading

function setProgress(pct, text) {
  const bar = el("bar"), track = el("track");
  if (pct == null) {
    track.classList.add("indeterminate");
    el("loaderSub").textContent = text;
    return;
  }
  track.classList.remove("indeterminate");
  bar.style.width = pct + "%";
  if (text) el("loaderSub").textContent = text;
}

loadBtn.addEventListener("click", async () => {
  loadBtn.disabled = true;
  loadBtn.textContent = "Loading…";
  el("statLeft").textContent = "downloading weights";
  setProgress(0, "starting…");

  try {
    generator = await pipeline("text-generation", MODEL_ID, {
      device,
      dtype: device === "webgpu" ? "q4f16" : "q4",
      progress_callback: (p) => {
        if (p.status === "progress" && p.total) {
          const pct = Math.round((p.loaded / p.total) * 100);
          const name = (p.file || "").split("/").pop();
          setProgress(pct, `${name || "weights"} · ${pct}%`);
        } else if (p.status === "done") {
          setProgress(100, "ready");
        } else if (p.status === "initiate") {
          setProgress(null, `fetching ${(p.file || "").split("/").pop() || "weights"}`);
        }
      },
    });

    el("loader").classList.add("hidden");
    input.disabled = false;
    input.placeholder = "Ask anything…";
    sendBtn.disabled = false;
    el("statLeft").textContent = device === "webgpu" ? "ready · webgpu" : "ready · cpu";
    input.focus();
  } catch (err) {
    console.error(err);
    setProgress(null, "load failed — " + (err.message || err));
    el("loaderSub").style.color = "var(--danger)";
    loadBtn.disabled = false;
    loadBtn.textContent = "Retry";
    el("statLeft").textContent = "load failed";
  }
});

// ------------------------------------------------------------------- prompting

function buildPrompt(question) {
  let out = "";
  for (const turn of history) {
    if (turn.role === "user") {
      out += `<|im_start|>user\n${turn.content}<|im_end|>\n`;
    } else {
      out += `<|im_start|>assistant\n<think>\n\n</think>\n\n${turn.content}<|im_end|>\n`;
    }
  }
  out += `<|im_start|>user\n${question}<|im_end|>\n`;
  out += THINK_OFF;
  return out;
}

const SPECIAL = /<\|im_end\|>|<\|im_start\|>|<\|endoftext\|>/g;

// ---------------------------------------------------------------------- render

function addTurn(role, text) {
  empty.classList.add("hidden");

  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "bot");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "you" : "ai";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  wrap.append(avatar, bubble);
  chat.append(wrap);
  chat.scrollTop = chat.scrollHeight;

  return bubble;
}

// ------------------------------------------------------------------ generation

async function ask(question) {
  if (!generator || busy) return;

  busy = true;
  cancelled = false;
  sendBtn.disabled = true;
  stopBtn.hidden = false;
  input.value = "";
  autosize();

  addTurn("user", question);
  const bubble = addTurn("assistant", "");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  bubble.append(cursor);

  let raw = "";
  let chunks = 0;
  const started = performance.now();

  const streamer = new TextStreamer(generator.tokenizer, {
    skip_prompt: true,
    skip_special_tokens: true,
    callback_function: (text) => {
      if (cancelled) throw new Error("__cancel__");
      raw += text;
      chunks++;
      bubble.textContent = raw.replace(SPECIAL, "");
      bubble.append(cursor);
      chat.scrollTop = chat.scrollHeight;

      const secs = (performance.now() - started) / 1000;
      if (secs > 0.4) {
        el("statRight").textContent = `${(chunks / secs).toFixed(1)} tok/s`;
      }
    },
  });

  try {
    await generator(buildPrompt(question), {
      max_new_tokens: 512,
      do_sample: true,
      temperature: 0.6,
      top_k: 20,
      top_p: 0.95,
      repetition_penalty: 1.1,
      return_full_text: false,
      streamer,
    });
  } catch (err) {
    if (!err.message.includes("__cancel__")) {
      bubble.textContent = "Error: " + err.message;
      bubble.style.color = "var(--danger)";
      cursor.remove();
      finish();
      return;
    }
  }

  cursor.remove();

  const answer = raw.replace(SPECIAL, "").trim();
  if (answer) {
    bubble.textContent = answer;
    history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: answer });
    // Bound the prefill cost on long conversations.
    if (history.length > 8) history.splice(0, history.length - 8);
  } else {
    bubble.textContent = "(stopped)";
    bubble.style.color = "var(--fg-faint)";
  }

  const total = (performance.now() - started) / 1000;
  el("statRight").textContent = `${chunks} chunks · ${total.toFixed(1)}s`;
  finish();
}

function finish() {
  busy = false;
  sendBtn.disabled = false;
  stopBtn.hidden = true;
  input.focus();
}

stopBtn.addEventListener("click", () => {
  cancelled = true;
  stopBtn.disabled = true;
  setTimeout(() => (stopBtn.disabled = false), 300);
});

// -------------------------------------------------------------------- compose

function submit() {
  const text = input.value.trim();
  if (!text) return;
  ask(text);
}

sendBtn.addEventListener("click", submit);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
});

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

input.addEventListener("input", autosize);

document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    if (!generator) return;
    ask(chip.dataset.p);
  });
});
</script>
</body>
</html>
